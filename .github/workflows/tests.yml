name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Core tests
        run: tests/run_tests.sh
      - name: Vendored Oregon files match oregon_v21_receiver
        run: tools/check_vendored.sh
      - name: Hardware variants match cc1101-sniffer.yaml
        run: tools/check_variants.py

  lint:
    name: Formatting (clang-format, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: |
          # The vendored Oregon files are checked by tools/check_vendored.sh instead.
          clang-format --dry-run -Werror components/rf_sniffer/rf_sniffer.* components/rf_sniffer/sniffer_core.* tests/test_core.cpp
      - name: ruff
        run: |
          pipx run ruff check components tools
          pipx run ruff format --check components tools

  esphome-compile:
    name: ESPHome ${{ matrix.version.name }} (${{ matrix.config }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.version.experimental }}
    strategy:
      fail-fast: false
      matrix:
        config: [cc1101-sniffer-wt32-eth01, cc1101-sniffer-esp32-wifi]
        version:
          - name: "2026.10.0 (oldest tested)"
            package: "esphome==2026.10.0"
            experimental: false
          - name: "latest release"
            package: "esphome"
            experimental: false
          - name: "dev"
            package: "esphome @ git+https://github.com/esphome/esphome.git@dev"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: |
          pip install "${{ matrix.version.package }}"
          echo "ESPHOME_VERSION=$(esphome version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}
      - name: Prepare config from the example
        run: |
          mkdir -p ci
          # Build the checked out component instead of the published one.
          sed "s#  - source: github://[Bb]oilerplate4u/esphome-cc1101-tools@.*#  - source:\n      type: local\n      path: ../components#" \
            "docs/${{ matrix.config }}.yaml" > ci/sniffer.yaml
          grep -q "type: local" ci/sniffer.yaml
          printf 'wifi_ssid: "ci"\nwifi_password: "ci-password"\n' > ci/secrets.yaml
      - name: Validate config
        run: esphome config ci/sniffer.yaml
      - name: Compile
        run: esphome compile ci/sniffer.yaml
