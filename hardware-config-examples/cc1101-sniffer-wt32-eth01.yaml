# CC1101 RF sniffer for 433 MHz OOK on WT32-ETH01
#
# Decodes every frame with all decoders (Oregon v2.1 and the ESPHome RF
# protocols) and logs one line per transmission with time, RSSI and repeat
# count. Unknown frames can be dumped raw. Everything is tuned in the web UI;
# all entities are internal, so nothing is exposed to Home Assistant.
#
# Log levels (logger level DEBUG shows everything)
#   DEBUG    decoded transmissions (tag rf_sniffer), raw frames (tag rf_raw)
#   INFO     clock synchronised, statistics reset
#   WARNING  clock not synchronised or no time source
#
# Version: see substitutions.version below, also shown in the boot log
#
# Changelog
#   1.1.0  2026-10-26  RSSI read only a few times per frame while the data pin is high
#                      (reading it every millisecond disturbed reception); rejected
#                      Oregon messages are logged and not offered to other decoders;
#                      Drayton and rc_switch need two copies and run only when shown;
#                      repeat wait counts from the end of a copy; raw log starts Off
#   1.0.0  2026-10-26  First release, based on cc1101-dumper 1.1.1 and the
#                      rf_sniffer component
#
# Wiring CC1101 -> WT32-ETH01 (pins are set in substitutions)
#   VCC   -> 3V3
#   GND   -> GND
#   SCK   -> IO14
#   MOSI  -> IO15   (SI)
#   MISO  -> IO35   (SO/GDO1, IO35 is input only)
#   CSN   -> IO4
#   GDO2  -> IO36   (RX data to remote_receiver, input only)
#   GDO0  -> CFG    (IO32, reserved for a later remote_transmitter)

substitutions:
  name: cc1101-sniffer
  friendly_name: CC1101 Sniffer
  version: "1.1.0"
  board: wt32-eth01
  timezone: Europe/London
  frequency: 433.92MHz
  spi_clk_pin: GPIO14   # IO14
  spi_mosi_pin: GPIO15  # IO15
  spi_miso_pin: GPIO35  # IO35
  cc1101_cs_pin: GPIO4  # IO4
  rx_pin: GPIO36        # IO36

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: boilerplate4u.cc1101-sniffer
    version: ${version}
  on_boot:
    priority: -100
    then:
      # Apply the stored settings after a restart
      - script.execute: apply_rf
      - script.execute: apply_rx
      - script.execute: apply_oregon
      - script.execute: apply_sniffer

external_components:
  # rf_sniffer from this repository (branch rf-sniffer until it is merged)
  - source: github://boilerplate4u/esphome-cc1101-tools@rf-sniffer
    components: [rf_sniffer]

esp32:
  board: ${board}
  framework:
    type: esp-idf

ethernet:
  type: LAN8720
  mdc_pin: GPIO23  # internal, not on the pin header
  mdio_pin: GPIO18  # internal, not on the pin header
  clk:
    pin: GPIO0  # (IO0)
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16  # internal, not on the pin header

logger:
  level: DEBUG
  logs:
    # The internal statistics sensors publish every minute; keep them out of the log
    sensor: INFO
    text_sensor: INFO

api:
  # The device is not added to Home Assistant, so never reboot for lack of an API client
  reboot_timeout: 0s

ota:
  - platform: esphome

# Wall clock for the log timestamps; without a sync they show the uptime
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

web_server:
  port: 80
  version: 3
  # Show internal entities in the web UI, they are never sent to Home Assistant
  include_internal: true
  sorting_groups:
    # Order follows the workflow: tune the radio, pick decoders, dig into raw frames
    - id: grp_radio
      name: "Radio and receiver"
      sorting_weight: 10
    - id: grp_decoders
      name: "Decoders"
      sorting_weight: 20
    - id: grp_oregon
      name: "Oregon v2.1 decoder"
      sorting_weight: 30
    - id: grp_raw
      name: "Raw log"
      sorting_weight: 40
    - id: grp_stats
      name: "Statistics"
      sorting_weight: 50

spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
  miso_pin: ${spi_miso_pin}

cc1101:
  id: radio
  cs_pin: ${cc1101_cs_pin}
  frequency: ${frequency}
  modulation_type: ASK/OOK
  filter_bandwidth: 203kHz
  symbol_rate: 5000

remote_receiver:
  id: rx
  pin:
    number: ${rx_pin}
    # Also watched by rf_sniffer (activity_pin) to time the RSSI reads
    allow_other_uses: true
  idle: 5ms
  # filter and tolerance are start values, then controlled by RX filter and RX tolerance
  filter: 100us
  tolerance: 35%
  # The classic ESP32 has 512 RMT symbols shared between RX and TX.
  # 448 for RX holds frames of about 890 pulses and leaves 64 for a later remote_transmitter.
  rmt_symbols: 448
  receive_symbols: 448
  # Fixed floor against the shortest noise bursts, can only be changed at compile time
  filter_symbols: 20

# One log line per transmission: time, decoder, decoded fields, RSSI, repeats.
# Raw frames, decoder visibility and Oregon timing are set in the web UI.
rf_sniffer:
  id: sniffer
  receiver_id: rx
  cc1101_id: radio
  # Same pin as remote_receiver: RSSI is read during frames while the pin is high
  activity_pin:
    number: ${rx_pin}
    allow_other_uses: true
  time_id: sntp_time
  update_interval: 60s
  statistics:
    frames:
      name: "Frames"
      internal: true
      web_server:
        sorting_group_id: grp_stats
        sorting_weight: 10
    decoded:
      name: "Decoded frames"
      internal: true
      web_server:
        sorting_group_id: grp_stats
        sorting_weight: 20
    unknown:
      name: "Unknown frames"
      internal: true
      web_server:
        sorting_group_id: grp_stats
        sorting_weight: 30
    oregon_rejected:
      name: "Rejected Oregon frames"
      internal: true
      web_server:
        sorting_group_id: grp_stats
        sorting_weight: 35
    noise_per_minute:
      name: "Noise frames per minute"
      internal: true
      web_server:
        sorting_group_id: grp_stats
        sorting_weight: 40
    noise_floor:
      name: "Noise floor"
      internal: true
      web_server:
        sorting_group_id: grp_stats
        sorting_weight: 50
    per_protocol:
      name: "Decoded per protocol"
      internal: true
      web_server:
        sorting_group_id: grp_stats
        sorting_weight: 60

number:
  - platform: template
    id: min_pulses
    internal: true
    web_server:
      sorting_group_id: grp_raw
      sorting_weight: 20
    name: "Min pulses per frame"
    icon: mdi:filter
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 0
    # 448 RMT symbols hold up to 896 pulses
    max_value: 896
    step: 1
    mode: box
    entity_category: config
    on_value:
      - lambda: id(sniffer).set_min_pulses((uint32_t) x);

  - platform: template
    id: rx_filter
    internal: true
    name: "RX filter"
    web_server:
      sorting_group_id: grp_radio
      sorting_weight: 80
    icon: mdi:filter-variant
    unit_of_measurement: us
    optimistic: true
    restore_value: true
    initial_value: 100
    # Below the shortest Nexa marks (about 211 us)
    min_value: 50
    max_value: 180
    step: 10
    mode: box
    entity_category: config
    on_value:
      - script.execute: apply_rx

  - platform: template
    id: rx_tolerance
    internal: true
    name: "RX tolerance"
    web_server:
      sorting_group_id: grp_radio
      sorting_weight: 90
    icon: mdi:plus-minus-variant
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 35
    min_value: 15
    max_value: 50
    step: 1
    mode: box
    entity_category: config
    on_value:
      - script.execute: apply_rx

  - platform: template
    id: max_repeat_wait
    internal: true
    name: "Max repeat wait"
    web_server:
      sorting_group_id: grp_decoders
      sorting_weight: 5
    icon: mdi:timer-outline
    unit_of_measurement: ms
    optimistic: true
    restore_value: true
    initial_value: 500
    min_value: 100
    max_value: 2000
    step: 50
    mode: box
    entity_category: config
    on_value:
      - lambda: id(sniffer).set_max_repeat_wait((uint32_t) x);

  # Oregon v2.1 decoder timing, applied together by apply_oregon
  # Defaults match the decoder, except Min preamble (20 instead of 24, see README)
  - platform: template
    id: ore_min_pulse
    internal: true
    web_server:
      sorting_group_id: grp_oregon
      sorting_weight: 20
    name: "Min pulse"
    icon: mdi:arrow-collapse-left
    unit_of_measurement: us
    optimistic: true
    restore_value: true
    initial_value: 200
    min_value: 100
    max_value: 400
    step: 10
    mode: box
    entity_category: config
    on_value:
      - script.execute: apply_oregon

  - platform: template
    id: ore_long_pulse
    internal: true
    web_server:
      sorting_group_id: grp_oregon
      sorting_weight: 30
    name: "Long pulse from"
    icon: mdi:arrow-split-vertical
    unit_of_measurement: us
    optimistic: true
    restore_value: true
    initial_value: 700
    min_value: 500
    max_value: 900
    step: 10
    mode: box
    entity_category: config
    on_value:
      - script.execute: apply_oregon

  - platform: template
    id: ore_max_pulse
    internal: true
    web_server:
      sorting_group_id: grp_oregon
      sorting_weight: 40
    name: "Max pulse"
    icon: mdi:arrow-collapse-right
    unit_of_measurement: us
    optimistic: true
    restore_value: true
    initial_value: 1200
    min_value: 1000
    max_value: 2000
    step: 10
    mode: box
    entity_category: config
    on_value:
      - script.execute: apply_oregon

  - platform: template
    id: ore_end_gap
    internal: true
    web_server:
      sorting_group_id: grp_oregon
      sorting_weight: 50
    name: "End gap"
    icon: mdi:timer-sand
    unit_of_measurement: us
    optimistic: true
    restore_value: true
    initial_value: 2500
    min_value: 1500
    max_value: 5000
    step: 100
    mode: box
    entity_category: config
    on_value:
      - script.execute: apply_oregon

  - platform: template
    id: ore_min_preamble
    internal: true
    web_server:
      sorting_group_id: grp_oregon
      sorting_weight: 60
    name: "Min preamble"
    icon: mdi:ray-start-arrow
    unit_of_measurement: pulses
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 8
    max_value: 64
    step: 1
    mode: box
    entity_category: config
    on_value:
      - script.execute: apply_oregon

