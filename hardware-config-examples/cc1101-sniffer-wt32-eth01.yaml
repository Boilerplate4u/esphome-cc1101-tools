button:
  - platform: template
    id: reset_statistics
    internal: true
    name: "Reset statistics"
    web_server:
      sorting_group_id: grp_stats
      sorting_weight: 70
    icon: mdi:counter
    entity_category: config
    # Zero the counters since boot, for example to compare before and after a setting change
    on_press:
      - lambda: id(sniffer).reset_statistics();

  - platform: restart
    id: restart_device
    internal: true
    name: "Restart device"
    web_server:
      sorting_group_id: grp_stats
      sorting_weight: 80
    icon: mdi:power-cycle
    entity_category: config

script:
  - id: apply_sniffer
    mode: queued
    then:
      - lambda: |-
          auto *s = id(sniffer);
          s->set_raw_mode_index(id(raw_log).active_index().value_or(0));
          if (!std::isnan(id(min_pulses).state))
            s->set_min_pulses((uint32_t) id(min_pulses).state);
          if (!std::isnan(id(max_repeat_wait).state))
            s->set_max_repeat_wait((uint32_t) id(max_repeat_wait).state);
          s->set_decoder_visible(rf_sniffer::Decoder::OREGON, id(oregon_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::NEXA, id(nexa_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::KEELOQ, id(keeloq_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::DOOYA, id(dooya_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::DRAYTON, id(drayton_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::BYRONSX, id(byronsx_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::BRENNENSTUHL, id(brennenstuhl_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::NEXUS, id(nexus_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::AOK, id(aok_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::CARDIN_S438, id(cardin_s438_visible).state);
          s->set_decoder_visible(rf_sniffer::Decoder::RC_SWITCH, id(rc_switch_visible).state);

  - id: apply_oregon
    mode: queued
    then:
      - lambda: |-
          // During setup the numbers publish one by one; wait until all have a value
          if (std::isnan(id(ore_min_pulse).state) || std::isnan(id(ore_long_pulse).state) ||
              std::isnan(id(ore_max_pulse).state) || std::isnan(id(ore_end_gap).state) ||
              std::isnan(id(ore_min_preamble).state)) return;
          rf_sniffer::ManchesterDecoder::Timing t;
          t.min_pulse_us = (uint32_t) id(ore_min_pulse).state;
          t.long_pulse_us = (uint32_t) id(ore_long_pulse).state;
          t.max_pulse_us = (uint32_t) id(ore_max_pulse).state;
          t.end_gap_us = (uint32_t) id(ore_end_gap).state;
          t.min_preamble = (uint8_t) id(ore_min_preamble).state;
          // Same rule as the decoder's own config validation
          if (!(t.min_pulse_us < t.long_pulse_us && t.long_pulse_us < t.max_pulse_us &&
                t.max_pulse_us < t.end_gap_us)) {
            ESP_LOGW("rf_sniffer", "Oregon timing ignored, must satisfy min < long < max < end gap");
            return;
          }
          id(sniffer).set_oregon_timing(t);
          id(sniffer).set_oregon_verify_bit_pairs(id(ore_verify_bit_pairs).state);

  - id: apply_rx
    mode: queued
    then:
      - lambda: |-
          // During setup the numbers publish one by one; wait until both have a value
          if (std::isnan(id(rx_filter).state) || std::isnan(id(rx_tolerance).state)) return;
          id(rx).set_filter_us((uint32_t) id(rx_filter).state);
          id(rx).set_tolerance((uint32_t) id(rx_tolerance).state, remote_base::TOLERANCE_MODE_PERCENTAGE);

  - id: apply_rf
    mode: queued
    then:
      - lambda: |-
          // The CC1101 only has these discrete bandwidth steps (kHz)
          static const float BW_KHZ[] = {58, 68, 81, 102, 116, 135, 162, 203,
                                         232, 270, 325, 406, 464, 541, 650, 812};
          auto *rf = id(radio);
          rf->set_filter_bandwidth(BW_KHZ[id(rx_bandwidth).active_index().value_or(7)] * 1000.0f);
          rf->set_rx_attenuation(static_cast<cc1101::RxAttenuation>(id(rx_atten).active_index().value_or(0)));
          rf->set_filter_length_ask_ook(static_cast<cc1101::FilterLengthAskOok>(id(ook_threshold).active_index().value_or(1)));
          rf->set_hyst_level(static_cast<cc1101::HystLevel>(id(ook_hyst).active_index().value_or(2)));
          rf->set_max_lna_gain(static_cast<cc1101::MaxLnaGain>(id(lna_max).active_index().value_or(0)));
          rf->set_max_dvga_gain(static_cast<cc1101::MaxDvgaGain>(id(dvga_max).active_index().value_or(3)));
          rf->set_magn_target(static_cast<cc1101::MagnTarget>(id(magn_target).active_index().value_or(7)));

select:
  - platform: template
    id: raw_log
    internal: true
    web_server:
      sorting_group_id: grp_raw
      sorting_weight: 10
    name: "Raw log"
    icon: mdi:text-box-outline
    optimistic: true
    # Always Off after a restart, raw dumps are only for short tests
    restore_value: false
    initial_option: "Off"
    # Same order as rf_sniffer::RawMode
    options: ["Off", "Unknown only", "All"]
    entity_category: config
    on_value:
      - lambda: id(sniffer).set_raw_mode_index(i);

  - platform: template
    id: rx_bandwidth
    internal: true
    web_server:
      sorting_group_id: grp_radio
      sorting_weight: 10
    name: "RX filter bandwidth kHz"
    icon: mdi:sine-wave
    optimistic: true
    restore_value: true
    initial_option: "203"
    # Same order as BW_KHZ in apply_rf
    options: ["58", "68", "81", "102", "116", "135", "162", "203",
              "232", "270", "325", "406", "464", "541", "650", "812"]
    entity_category: config
    on_value:
      - script.execute: apply_rf

  # All lists below follow the enum order in cc1101defs.h
  # initial_option matches the ESPHome default
  - platform: template
    id: rx_atten
    internal: true
    web_server:
      sorting_group_id: grp_radio
